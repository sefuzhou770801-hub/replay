<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — 自建字幕向原生靠拢</title>
<style>
  :root {
    --ink: #ece8df;
    --muted: #9a958a;
    --bar: rgba(14, 13, 11, 0.92);
    --hair: rgba(255, 255, 255, 0.12);
    --cap: #ffffff;
    --plate: rgba(0, 0, 0, 0.90);
    --fade: 200ms;
    --font: "SF Pro Text", "Helvetica Neue", "PingFang SC", "Noto Sans SC",
            -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #12110f;
    color: var(--ink);
    font-family: var(--font);
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }
  .proto-banner {
    flex: 0 0 auto;
    padding: 8px 16px 7px;
    background: #1a1814;
    border-bottom: 1px solid var(--hair);
    letter-spacing: 0.04em;
  }
  .proto-kicker {
    font-size: 11px;
    font-weight: 700;
    color: #e6b35a;
    text-transform: uppercase;
  }
  .proto-q {
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.35;
  }
  .proto-state {
    margin-top: 3px;
    font-size: 12px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .stage-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 18px 84px;
  }
  .stage {
    position: relative;
    width: min(100%, calc((100dvh - 148px) * 1400 / 953));
    aspect-ratio: 1400 / 953;
    max-height: 100%;
    background: #000;
    overflow: hidden;
  }
  .stage img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    pointer-events: none;
  }
  .overlay {
    position: absolute;
    left: 50%;
    bottom: 22%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    max-width: 74%;
  }
  .overlay.is-active { display: flex; }
  .cue {
    opacity: 0;
    filter: blur(7px);
    transform: translateY(2px);
    transition:
      opacity var(--fade) ease,
      filter var(--fade) ease,
      transform var(--fade) ease;
  }
  .cue.is-on {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
  }
  @media (prefers-reduced-motion: reduce) {
    .cue { transition: none; filter: none; transform: none; }
  }

  /* A — 一个底板，完整句，双语同框 */
  .board-a {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 0.18em;
    width: max-content;
    max-width: min(72vw, 36rem);
    padding: 0.52em 0.95em 0.58em;
    border-radius: 1.05em;
    background: var(--plate);
    color: var(--cap);
    text-align: center;
  }
  .board-a .en {
    font-size: clamp(15px, 1.55vw, 21px);
    font-weight: 400;
    line-height: 1.28;
    letter-spacing: 0.01em;
  }
  .board-a .zh {
    font-size: clamp(14px, 1.45vw, 20px);
    font-weight: 400;
    line-height: 1.35;
  }

  /* B — 两个独立胶囊，宽度各随内容 */
  .stack-b {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.32em;
  }
  .pill {
    display: inline-block;
    width: max-content;
    max-width: 78vw;
    padding: 0.32em 0.72em 0.38em;
    border-radius: 999px;
    background: var(--plate);
    color: var(--cap);
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: 0.005em;
    text-align: center;
    white-space: nowrap;
  }
  .stack-b .en { font-size: clamp(18px, 2.15vw, 30px); }
  .stack-b .zh { font-size: clamp(16px, 1.95vw, 26px); }

  /* C — 中文主字幕，英文弱辅助在上 */
  .stack-c {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.28em;
  }
  .stack-c .en {
    font-size: clamp(13px, 1.35vw, 18px);
    font-weight: 400;
    opacity: 0.68;
    padding: 0.26em 0.62em 0.3em;
    background: rgba(0, 0, 0, 0.72);
  }
  .stack-c .zh {
    font-size: clamp(20px, 2.45vw, 34px);
    font-weight: 400;
    padding: 0.34em 0.78em 0.4em;
  }

  .switcher {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: var(--bar);
    border: 1px solid var(--hair);
    border-radius: 999px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(16px);
  }
  .switcher button {
    appearance: none;
    border: 0;
    background: #2a271f;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    border-radius: 999px;
  }
  .switcher button:hover { background: #3a362c; }
  .switcher button:focus-visible {
    outline: 2px solid #e6b35a;
    outline-offset: 2px;
  }
  .arrow {
    width: 34px;
    height: 34px;
    font-size: 18px;
    line-height: 1;
  }
  .variant-name {
    min-width: 168px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    padding: 0 6px;
  }
  .replay {
    height: 34px;
    padding: 0 14px;
    font-size: 13px;
    margin-left: 4px;
  }

  @media (max-width: 1200px), (max-height: 800px) {
    .proto-banner { padding: 6px 12px 5px; }
    .proto-q { font-size: 11px; }
    .stage-wrap { padding: 6px 10px 76px; }
    .variant-name { min-width: 148px; font-size: 12px; }
    .pill { white-space: normal; }
  }
</style>
</head>
<body>
<!-- Three variants of bilingual subtitle structure vs burned-in native captions, switchable via ?variant=. Throwaway. -->
<header class="proto-banner">
  <div class="proto-kicker">PROTOTYPE — THROWAWAY</div>
  <div class="proto-q">自建双语字幕用哪种结构，最接近画面里那条原生字幕？画面中已有的黑色胶囊是对照，不要改它。</div>
  <div class="proto-state" id="state">方案 A · 双语同框 · 短语 1 / 3 · 已暂停</div>
</header>

<nav class="switcher" aria-label="方案切换">
  <button class="arrow" id="prev" type="button" aria-label="上一个方案">←</button>
  <div class="variant-name" id="variant-label">A · 双语同框</div>
  <button class="arrow" id="next" type="button" aria-label="下一个方案">→</button>
  <button class="replay" id="replay" type="button">重播动画</button>
</nav>

<script>
(function () {
  var VARIANTS = [
    { key: "A", name: "双语同框" },
    { key: "B", name: "双层胶囊" },
    { key: "C", name: "中文主字幕" }
  ];

  var PHRASES = {
    A: [
      {
        en: "inside of it. So everything is tested for me.",
        zh: "在里面。所以一切都为我测试好了。"
      },
      {
        en: "Now, these things sometimes need your help, right?",
        zh: "现在，这些东西有时需要你的帮助，对吧？"
      },
      {
        en: "inside of it. So everything is tested for me. Now, these things sometimes need your help, right?",
        zh: "在里面。所以一切都为我测试好了。现在，这些东西有时需要你的帮助，对吧？"
      }
    ],
    B: [
      { en: "inside of it.", zh: "在里面。" },
      { en: "So everything is tested for me.", zh: "所以一切都为我测试好了。" },
      { en: "me. Now these", zh: "现在，这些" },
      { en: "sometimes need your help right.", zh: "有时需要你的帮助，对吧？" }
    ],
    C: [
      { en: "inside of it.", zh: "在里面。" },
      { en: "So everything is tested for me.", zh: "所以一切都为我测试好了。" },
      { en: "me. Now these", zh: "现在，这些" },
      { en: "sometimes need your help right.", zh: "有时需要你的帮助，对吧？" }
    ]
  };

  var HOLD_MS = 1450;
  var FADE_MS = 200;
  var GAP_MS = 70;

  var variant = "A";
  var phraseIndex = 0;
  var playing = false;
  var timers = [];

  function phrases() {
    return PHRASES[variant];
  }

  function parseVariant() {
    var raw = new URLSearchParams(location.search).get("variant") || "A";
    raw = String(raw).toUpperCase();
    return VARIANTS.some(function (item) { return item.key === raw; }) ? raw : "A";
  }

  function setUrl(key) {
    var url = new URL(location.href);
    url.searchParams.set("variant", key);
    history.replaceState(null, "", url);
  }

  function variantMeta() {
    return VARIANTS.find(function (item) { return item.key === variant; });
  }

  function renderState() {
    var meta = variantMeta();
    var list = phrases();
    var playLabel = playing ? "播放中" : "已暂停";
    document.getElementById("state").textContent =
      "方案 " + meta.key + " · " + meta.name +
      " · 短语 " + (phraseIndex + 1) + " / " + list.length +
      " · " + playLabel;
    document.getElementById("variant-label").textContent =
      meta.key + " · " + meta.name;
  }

  function showOverlay() {
    ["A", "B", "C"].forEach(function (key) {
      document.getElementById("overlay-" + key)
        .classList.toggle("is-active", key === variant);
    });
  }

  function fillText() {
    var item = phrases()[phraseIndex];
    var prefix = variant.toLowerCase();
    document.getElementById(prefix + "-en").textContent = item.en;
    document.getElementById(prefix + "-zh").textContent = item.zh;
  }

  function cueEl() {
    return document.getElementById("cue-" + variant);
  }

  function setOn(on) {
    cueEl().classList.toggle("is-on", on);
  }

  function clearTimers() {
    timers.forEach(function (id) { clearTimeout(id); });
    timers = [];
  }

  function later(ms, fn) {
    var id = setTimeout(fn, ms);
    timers.push(id);
  }

  function paintStill() {
    fillText();
    showOverlay();
    setOn(true);
    renderState();
  }

  function playFrom(start) {
    clearTimers();
    playing = true;
    phraseIndex = start;
    fillText();
    showOverlay();
    setOn(false);
    renderState();

    later(20, function () {
      setOn(true);
      renderState();
      holdThenAdvance();
    });
  }

  function holdThenAdvance() {
    later(HOLD_MS, function () {
      var list = phrases();
      if (phraseIndex >= list.length - 1) {
        playing = false;
        renderState();
        return;
      }
      setOn(false);
      later(FADE_MS + GAP_MS, function () {
        phraseIndex += 1;
        fillText();
        renderState();
        later(16, function () {
          setOn(true);
          holdThenAdvance();
        });
      });
    });
  }

  function switchTo(key) {
    if (key === variant && !playing) {
      return;
    }
    variant = key;
    setUrl(key);
    playFrom(0);
  }

  function step(delta) {
    var idx = VARIANTS.findIndex(function (item) { return item.key === variant; });
    var next = VARIANTS[(idx + delta + VARIANTS.length) % VARIANTS.length];
    switchTo(next.key);
  }

  document.getElementById("prev").addEventListener("click", function () { step(-1); });
  document.getElementById("next").addEventListener("click", function () { step(1); });
  document.getElementById("replay").addEventListener("click", function () { playFrom(0); });

  document.addEventListener("keydown", function (event) {
    var tag = (event.target && event.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || event.target.isContentEditable) return;
    if (event.key === "ArrowLeft") {
      event.preventDefault();
      step(-1);
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      step(1);
    } else if (event.key === " ") {
      event.preventDefault();
      playFrom(0);
    }
  });

  variant = parseVariant();
  setUrl(variant);
  phraseIndex = 0;
  fillText();
  showOverlay();
  playFrom(0);
})();
</script>
